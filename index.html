<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Bars</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <div class="skill">
      <span class="skill__name">HTML</span>
      <div class="bar"><div class="fill f90"><span class="tip">90%</span></div></div>
    </div>

    <div class="skill">
      <span class="skill__name">CSS</span>
      <div class="bar"><div class="fill f60"><span class="tip">60%</span></div></div>
    </div>

    <div class="skill">
      <span class="skill__name">jQuery</span>
      <div class="bar"><div class="fill f85"><span class="tip">85%</span></div></div>
    </div>

    <div class="skill">
      <span class="skill__name">Python</span>
      <div class="bar"><div class="fill f50"><span class="tip">50%</span></div></div>
    </div>

    <div class="skill">
      <span class="skill__name">MySQL</span>
      <div class="bar"><div class="fill f75"><span class="tip">75%</span></div></div>
    </div>

  </div>

</body>
</html>
